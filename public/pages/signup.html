<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PakBuild Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#059669', primaryHover: '#047857' } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .input-field { background: rgba(30, 41, 59, 0.5); border: 1.5px solid rgba(100, 116, 139, 0.3); transition: all 0.3s ease; }
        .input-field:focus { border-color: #059669; box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15); background: rgba(30, 41, 59, 0.8); }
        .btn-primary { background: linear-gradient(135deg, #059669, #10b981); transition: all 0.3s ease; }
        .btn-primary:hover { background: linear-gradient(135deg, #047857, #059669); transform: translateY(-1px); box-shadow: 0 8px 25px rgba(5, 150, 105, 0.3); }
        .bg-mesh { background: radial-gradient(at 20% 80%, rgba(5, 150, 105, 0.15) 0, transparent 50%), radial-gradient(at 80% 20%, rgba(16, 185, 129, 0.08) 0, transparent 50%); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeInUp 0.6s ease forwards; }
        .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b; }
        .strength-bar { height: 4px; border-radius: 2px; transition: all 0.4s ease; }
        @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(5deg); } }
        .float-shape { animation: float 6s ease-in-out infinite; }
        .social-btn { transition: all 0.3s ease; border: 1px solid rgba(100,116,139,0.3); }
        .social-btn:hover { border-color: rgba(100,116,139,0.5); transform: translateY(-1px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 bg-mesh">
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none overflow-hidden z-0">
        <div class="absolute top-20 right-10 w-72 h-72 bg-emerald-500/5 rounded-full blur-3xl float-shape"></div>
        <div class="absolute bottom-20 left-10 w-96 h-96 bg-teal-500/5 rounded-full blur-3xl float-shape" style="animation-delay: -3s;"></div>
        <div class="absolute top-1/3 right-1/3 w-40 h-40 bg-emerald-500/3 rounded-full blur-2xl float-shape" style="animation-delay: -1.5s;"></div>
    </div>
    <div class="relative z-10 w-full max-w-md animate-in">
        <div class="text-center mb-8">
            <a href="../" class="inline-flex items-center space-x-3 mb-6">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-emerald-500/25">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                </div>
                <span class="text-2xl font-bold text-white">PakBuild<span class="text-emerald-400">Pro</span></span>
            </a>
            <h1 class="text-3xl font-bold text-white">Create Account</h1>
            <p class="text-slate-400 text-sm mt-2">Join thousands of homeowners building smarter</p>
        </div>
        <div class="glass rounded-3xl p-8 shadow-2xl shadow-black/20">
            <form id="signupForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Full Name</label>
                    <div class="relative">
                        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        <input type="text" id="signupName" required placeholder="John Doe" class="input-field w-full pl-11 pr-4 py-3.5 rounded-xl text-sm text-slate-200 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative">
                        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/></svg>
                        <input type="email" id="signupEmail" required placeholder="you@example.com" class="input-field w-full pl-11 pr-4 py-3.5 rounded-xl text-sm text-slate-200 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Phone <span class="text-slate-500 normal-case">(optional)</span></label>
                    <div class="relative">
                        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                        <input type="tel" id="signupPhone" placeholder="923001234567" class="input-field w-full pl-11 pr-4 py-3.5 rounded-xl text-sm text-slate-200 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        <input type="password" id="signupPassword" required minlength="6" placeholder="Min 6 characters" class="input-field w-full pl-11 pr-12 py-3.5 rounded-xl text-sm text-slate-200 focus:outline-none" oninput="checkStrength(this.value)">
                        <span class="password-toggle" onclick="togglePassword('signupPassword', this)">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </span>
                    </div>
                    <div id="strengthIndicator" class="mt-2 flex space-x-1 hidden">
                        <div id="str1" class="strength-bar flex-1 bg-slate-700"></div>
                        <div id="str2" class="strength-bar flex-1 bg-slate-700"></div>
                        <div id="str3" class="strength-bar flex-1 bg-slate-700"></div>
                    </div>
                    <p id="strengthText" class="text-xs mt-1 hidden"></p>
                </div>
                <div id="signupError" class="bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center py-3 px-4 rounded-xl hidden"></div>
                <label class="flex items-start space-x-2 cursor-pointer">
                    <input type="checkbox" id="agreeTerms" required class="w-4 h-4 mt-0.5 rounded border-slate-600 bg-slate-800 text-emerald-500 focus:ring-emerald-500/30">
                    <span class="text-xs text-slate-400">I agree to the <a href="#" class="text-emerald-400 hover:text-emerald-300">Terms of Service</a> and <a href="#" class="text-emerald-400 hover:text-emerald-300">Privacy Policy</a></span>
                </label>
                <button type="submit" id="signupBtn" class="btn-primary w-full py-3.5 rounded-xl text-white font-semibold shadow-lg shadow-emerald-600/20 flex items-center justify-center space-x-2 mt-2">
                    <span>Create Account</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </form>
            <div class="flex items-center space-x-4 my-6">
                <div class="flex-1 h-px bg-slate-700/50"></div>
                <span class="text-xs text-slate-500 uppercase tracking-wider">or sign up with</span>
                <div class="flex-1 h-px bg-slate-700/50"></div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button type="button" class="social-btn py-3 rounded-xl bg-slate-800/50 text-slate-300 font-medium text-sm flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    <span>Google</span>
                </button>
                <button type="button" class="social-btn py-3 rounded-xl bg-slate-800/50 text-slate-300 font-medium text-sm flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    <span>GitHub</span>
                </button>
            </div>
            <a href="login.html" class="block w-full py-3.5 rounded-xl border border-slate-700 text-slate-300 font-semibold text-center hover:border-emerald-500/50 hover:text-emerald-400 transition-all duration-300 mt-4">
                Already have an account? Sign In
            </a>
        </div>
        <div class="text-center mt-6">
            <a href="../" class="inline-flex items-center space-x-2 text-sm text-slate-500 hover:text-emerald-400 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                <span>Back to Home</span>
            </a>
        </div>
    </div>

    <script>
        function getLocalUsers() { return JSON.parse(localStorage.getItem('pb_users') || '[]'); }
        function saveLocalUsers(users) { localStorage.setItem('pb_users', JSON.stringify(users)); }

        function togglePassword(id, el) {
            const input = document.getElementById(id);
            if (input.type === 'password') { input.type = 'text'; el.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>'; }
            else { input.type = 'password'; el.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>'; }
        }

        function checkStrength(pw) {
            const ind = document.getElementById('strengthIndicator');
            const txt = document.getElementById('strengthText');
            if (pw.length === 0) { ind.classList.add('hidden'); txt.classList.add('hidden'); return; }
            ind.classList.remove('hidden'); txt.classList.remove('hidden');
            let score = 0;
            if (pw.length >= 6) score++;
            if (pw.length >= 10) score++;
            if (/[A-Z]/.test(pw) && /[0-9]/.test(pw)) score++;
            const colors = ['bg-red-500', 'bg-amber-500', 'bg-emerald-500', 'bg-emerald-400'];
            const labels = ['Weak', 'Fair', 'Strong', 'Very Strong'];
            const textColors = ['text-red-400', 'text-amber-400', 'text-emerald-400', 'text-emerald-300'];
            for (let i = 1; i <= 3; i++) {
                document.getElementById('str' + i).className = 'strength-bar flex-1 ' + (i <= score ? colors[score] : 'bg-slate-700');
            }
            txt.textContent = labels[score] || 'Too short';
            txt.className = 'text-xs mt-1 ' + (textColors[score] || 'text-red-400');
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            const errorDiv = document.getElementById('signupError');
            errorDiv.classList.add('hidden');
            btn.innerHTML = '<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg><span>Creating account...</span>';
            btn.disabled = true;

            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim().toLowerCase();
            const phone = document.getElementById('signupPhone').value.replace(/[^0-9]/g, '');
            const password = document.getElementById('signupPassword').value;

            // Try backend first, fallback to localStorage
            try {
                const res = await fetch('/api/auth?action=register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('pakbuild_token', data.token);
                    localStorage.setItem('pakbuild_user', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html';
                    return;
                }
            } catch (err) {}

            // Fallback: localStorage register
            const users = getLocalUsers();
            if (users.find(u => u.email === email)) {
                errorDiv.textContent = 'Email already registered. Please login.';
                errorDiv.classList.remove('hidden');
                resetBtn(btn);
                return;
            }
            const newUser = {
                id: 'user_' + Date.now(),
                name, email, phone, password,
                role: 'user',
                createdAt: new Date().toISOString(),
                savedProjects: [],
                bookings: [],
                inquiries: []
            };
            users.push(newUser);
            saveLocalUsers(users);

            const token = 'local_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('pakbuild_token', token);
            localStorage.setItem('pakbuild_user', JSON.stringify({
                id: newUser.id, name: newUser.name, email: newUser.email, phone: newUser.phone, role: newUser.role
            }));
            window.location.href = 'dashboard.html';
        });

        function resetBtn(btn) {
            btn.innerHTML = '<span>Create Account</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>';
            btn.disabled = false;
        }
    </script>
</body>
</html>
