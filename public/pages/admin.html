<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - PakBuild Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .tab-active { background: #059669; color: white; }
        .tab-inactive { background: #1e293b; color: #94a3b8; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <nav class="sticky top-0 z-50 glass border-b border-slate-800 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center text-white font-bold text-xl">A</div>
            <span class="text-xl font-bold text-white">Admin<span class="text-red-400">Panel</span></span>
        </div>
        <div class="flex items-center space-x-4">
            <span id="adminName" class="text-sm text-slate-300"></span>
            <a href="/" class="text-sm text-slate-400 hover:text-white transition">Home</a>
            <button onclick="logout()" class="text-sm text-red-400 hover:text-red-300 transition">Logout</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-white mb-6">Admin Dashboard</h1>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-8">
            <div class="glass p-5 rounded-2xl text-center">
                <span class="text-xs text-slate-400 uppercase">Users</span>
                <div id="statUsers" class="text-2xl font-bold text-blue-400 mt-1">0</div>
            </div>
            <div class="glass p-5 rounded-2xl text-center">
                <span class="text-xs text-slate-400 uppercase">Total Bookings</span>
                <div id="statBookings" class="text-2xl font-bold text-emerald-400 mt-1">0</div>
            </div>
            <div class="glass p-5 rounded-2xl text-center">
                <span class="text-xs text-slate-400 uppercase">Pending</span>
                <div id="statPending" class="text-2xl font-bold text-amber-400 mt-1">0</div>
            </div>
            <div class="glass p-5 rounded-2xl text-center">
                <span class="text-xs text-slate-400 uppercase">Total Inquiries</span>
                <div id="statInquiries" class="text-2xl font-bold text-purple-400 mt-1">0</div>
            </div>
            <div class="glass p-5 rounded-2xl text-center">
                <span class="text-xs text-slate-400 uppercase">New Inquiries</span>
                <div id="statNew" class="text-2xl font-bold text-red-400 mt-1">0</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-3 mb-6">
            <button onclick="switchTab('bookings')" id="tab-bookings" class="px-4 py-2 rounded-xl text-sm font-semibold transition tab-active">Bookings</button>
            <button onclick="switchTab('inquiries')" id="tab-inquiries" class="px-4 py-2 rounded-xl text-sm font-semibold transition tab-inactive">Inquiries</button>
            <button onclick="switchTab('users')" id="tab-users" class="px-4 py-2 rounded-xl text-sm font-semibold transition tab-inactive">Users</button>
            <button onclick="switchTab('materials')" id="tab-materials" class="px-4 py-2 rounded-xl text-sm font-semibold transition tab-inactive">Material Rates</button>
        </div>

        <!-- Content Sections -->
        <div id="content-bookings" class="glass p-6 rounded-2xl space-y-4">
            <h3 class="text-lg font-bold text-white">All Bookings</h3>
            <div id="bookingsTable" class="space-y-3">Loading...</div>
        </div>

        <div id="content-inquiries" class="glass p-6 rounded-2xl space-y-4 hidden">
            <h3 class="text-lg font-bold text-white">All Inquiries</h3>
            <div id="inquiriesTable" class="space-y-3">Loading...</div>
        </div>

        <div id="content-users" class="glass p-6 rounded-2xl space-y-4 hidden">
            <h3 class="text-lg font-bold text-white">All Users</h3>
            <div id="usersTable" class="space-y-3">Loading...</div>
        </div>

        <div id="content-materials" class="glass p-6 rounded-2xl space-y-4 hidden">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-white">Material Rates</h3>
                <button onclick="seedRates()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-xl text-sm font-semibold transition">Seed Default Rates</button>
            </div>
            <div id="materialsTable" class="space-y-3">Loading...</div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('pakbuild_token');
        const user = JSON.parse(localStorage.getItem('pakbuild_user'));

        if (!token || !user || user.role !== 'admin') {
            window.location.href = '/pages/login.html';
        }

        document.getElementById('adminName').textContent = user?.name || 'Admin';
        const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

        function switchTab(tab) {
            ['bookings', 'inquiries', 'users', 'materials'].forEach(t => {
                document.getElementById(`content-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = 'px-4 py-2 rounded-xl text-sm font-semibold transition tab-inactive';
            });
            document.getElementById(`content-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = 'px-4 py-2 rounded-xl text-sm font-semibold transition tab-active';
        }

        async function loadDashboard() {
            try {
                const res = await fetch('/api/admin?action=dashboard', { headers });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('statUsers').textContent = data.stats.totalUsers;
                    document.getElementById('statBookings').textContent = data.stats.totalBookings;
                    document.getElementById('statPending').textContent = data.stats.pendingBookings;
                    document.getElementById('statInquiries').textContent = data.stats.totalInquiries;
                    document.getElementById('statNew').textContent = data.stats.newInquiries;
                    renderBookings(data.recentBookings);
                    renderInquiries(data.recentInquiries);
                }
                const usersRes = await fetch('/api/admin?action=users', { headers });
                const usersData = await usersRes.json();
                if (usersData.success) renderUsers(usersData.users);
                loadMaterials();
            } catch (err) {
                console.error(err);
            }
        }

        function renderBookings(bookings) {
            const container = document.getElementById('bookingsTable');
            if (!bookings || bookings.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm">No bookings found.</p>';
                return;
            }
            container.innerHTML = bookings.map(b => `
                <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <span class="text-white font-semibold">${b.name || 'N/A'} - ${b.date} ${b.timeSlot}</span>
                        <p class="text-slate-400 text-xs mt-1">${b.serviceType} | ${b.city}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="px-2 py-1 rounded-lg text-xs font-semibold ${b.status === 'confirmed' ? 'bg-emerald-500/20 text-emerald-400' : b.status === 'pending' ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-500/20 text-slate-400'}">${b.status}</span>
                        <select onchange="updateBookingStatus('${b._id}', this.value)" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white">
                            <option value="pending" ${b.status === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="confirmed" ${b.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                            <option value="completed" ${b.status === 'completed' ? 'selected' : ''}>Completed</option>
                            <option value="cancelled" ${b.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                    </div>
                </div>
            `).join('');
        }

        function renderInquiries(inquiries) {
            const container = document.getElementById('inquiriesTable');
            if (!inquiries || inquiries.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm">No inquiries found.</p>';
                return;
            }
            container.innerHTML = inquiries.map(i => `
                <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <span class="text-white font-semibold">${i.name} - ${i.email}</span>
                        <p class="text-slate-400 text-xs mt-1">${i.serviceType} | ${i.city} | ${i.phone}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="px-2 py-1 rounded-lg text-xs font-semibold ${i.status === 'new' ? 'bg-red-500/20 text-red-400' : i.status === 'contacted' ? 'bg-blue-500/20 text-blue-400' : 'bg-emerald-500/20 text-emerald-400'}">${i.status}</span>
                        <select onchange="updateInquiryStatus('${i._id}', this.value)" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white">
                            <option value="new" ${i.status === 'new' ? 'selected' : ''}>New</option>
                            <option value="contacted" ${i.status === 'contacted' ? 'selected' : ''}>Contacted</option>
                            <option value="resolved" ${i.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                            <option value="archived" ${i.status === 'archived' ? 'selected' : ''}>Archived</option>
                        </select>
                    </div>
                </div>
            `).join('');
        }

        function renderUsers(users) {
            const container = document.getElementById('usersTable');
            if (!users || users.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm">No users found.</p>';
                return;
            }
            container.innerHTML = users.map(u => `
                <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <span class="text-white font-semibold">${u.name}</span>
                        <p class="text-slate-400 text-xs mt-1">${u.email} | ${u.role}</p>
                    </div>
                    <span class="text-slate-500 text-xs">${new Date(u.createdAt).toLocaleDateString()}</span>
                </div>
            `).join('');
        }

        async function loadMaterials() {
            try {
                const res = await fetch('/api/materials');
                const data = await res.json();
                const container = document.getElementById('materialsTable');
                if (data.success && data.rates.length > 0) {
                    container.innerHTML = data.rates.map(r => `
                        <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                            <div>
                                <span class="text-white font-semibold capitalize">${r.material}</span>
                                <p class="text-slate-400 text-xs mt-1">${r.city} | ${r.brand} | ${r.unit}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-emerald-400 font-bold">PKR ${r.priceMin.toLocaleString()} - ${r.priceMax.toLocaleString()}</span>
                                <p class="text-xs mt-1 ${r.trend === 'up' ? 'text-red-400' : r.trend === 'down' ? 'text-emerald-400' : 'text-slate-400'}">${r.trend === 'up' ? '▲' : r.trend === 'down' ? '▼' : '—'} ${Math.abs(r.trendPercent)}%</p>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="text-slate-500 text-sm">No rates found. Click "Seed Default Rates" to populate.</p>';
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function updateBookingStatus(id, status) {
            await fetch(`/api/bookings?action=status&id=${id}`, {
                method: 'PUT', headers, body: JSON.stringify({ status })
            });
            loadDashboard();
        }

        async function updateInquiryStatus(id, status) {
            await fetch(`/api/inquiries?action=status&id=${id}`, {
                method: 'PUT', headers, body: JSON.stringify({ status })
            });
            loadDashboard();
        }

        async function seedRates() {
            await fetch('/api/materials?action=seed', { method: 'POST', headers });
            loadMaterials();
        }

        function logout() {
            localStorage.removeItem('pakbuild_token');
            localStorage.removeItem('pakbuild_user');
            window.location.href = '/';
        }

        loadDashboard();
    </script>
</body>
</html>
