<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - PakBuild Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#059669', primaryHover: '#047857' } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .bg-mesh { background: radial-gradient(at 20% 80%, rgba(5, 150, 105, 0.1) 0, transparent 50%), radial-gradient(at 80% 20%, rgba(16, 185, 129, 0.05) 0, transparent 50%); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-card { animation: fadeInUp 0.5s ease forwards; opacity: 0; }
        .tab-btn { transition: all 0.3s ease; }
        .tab-btn.active { background: linear-gradient(135deg, #059669, #10b981); color: white; box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3); }
        .tab-btn:not(.active) { background: rgba(30, 41, 59, 0.5); color: #94a3b8; }
        .tab-btn:not(.active):hover { background: rgba(30, 41, 59, 0.8); color: white; }
        select { background: rgba(30, 41, 59, 0.8); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen bg-mesh">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass border-b border-slate-800/50 px-4 sm:px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="../" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-500 to-orange-600 flex items-center justify-center text-white font-bold text-lg shadow-lg shadow-red-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                </div>
                <span class="text-xl font-bold text-white">Admin<span class="text-red-400">Panel</span></span>
            </a>
            <div class="flex items-center space-x-4">
                <div class="hidden sm:flex items-center space-x-2 bg-slate-800/50 rounded-xl px-4 py-2">
                    <div class="w-8 h-8 rounded-lg bg-red-500/20 flex items-center justify-center text-red-400 font-bold text-sm" id="adminAvatar">A</div>
                    <span id="adminName" class="text-sm text-slate-300 font-medium"></span>
                </div>
                <a href="../" class="text-sm text-slate-400 hover:text-white transition p-2 rounded-lg hover:bg-slate-800/50">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                </a>
                <button onclick="logout()" class="text-sm text-slate-400 hover:text-red-400 transition p-2 rounded-lg hover:bg-red-500/10">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Admin Dashboard</h1>
            <p class="text-slate-400 text-sm">Manage bookings, inquiries, users, and material rates</p>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-4 mb-8">
            <div class="glass p-5 rounded-2xl text-center animate-card border-t-2 border-blue-500" style="animation-delay:0.1s">
                <svg class="w-6 h-6 text-blue-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/></svg>
                <div class="text-xs text-slate-400 uppercase font-semibold">Users</div>
                <div id="statUsers" class="text-2xl font-bold text-blue-400 mt-1">0</div>
            </div>
            <div class="glass p-5 rounded-2xl text-center animate-card border-t-2 border-emerald-500" style="animation-delay:0.15s">
                <svg class="w-6 h-6 text-emerald-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <div class="text-xs text-slate-400 uppercase font-semibold">Bookings</div>
                <div id="statBookings" class="text-2xl font-bold text-emerald-400 mt-1">0</div>
            </div>
            <div class="glass p-5 rounded-2xl text-center animate-card border-t-2 border-amber-500" style="animation-delay:0.2s">
                <svg class="w-6 h-6 text-amber-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <div class="text-xs text-slate-400 uppercase font-semibold">Pending</div>
                <div id="statPending" class="text-2xl font-bold text-amber-400 mt-1">0</div>
            </div>
            <div class="glass p-5 rounded-2xl text-center animate-card border-t-2 border-purple-500" style="animation-delay:0.25s">
                <svg class="w-6 h-6 text-purple-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <div class="text-xs text-slate-400 uppercase font-semibold">Inquiries</div>
                <div id="statInquiries" class="text-2xl font-bold text-purple-400 mt-1">0</div>
            </div>
            <div class="glass p-5 rounded-2xl text-center animate-card border-t-2 border-red-500" style="animation-delay:0.3s">
                <svg class="w-6 h-6 text-red-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                <div class="text-xs text-slate-400 uppercase font-semibold">New</div>
                <div id="statNew" class="text-2xl font-bold text-red-400 mt-1">0</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex flex-wrap gap-2 mb-6">
            <button onclick="switchTab('bookings')" id="tab-bookings" class="tab-btn active px-5 py-2.5 rounded-xl text-sm font-semibold flex items-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span>Bookings</span>
            </button>
            <button onclick="switchTab('inquiries')" id="tab-inquiries" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-semibold flex items-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>Inquiries</span>
            </button>
            <button onclick="switchTab('users')" id="tab-users" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-semibold flex items-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/></svg>
                <span>Users</span>
            </button>
            <button onclick="switchTab('materials')" id="tab-materials" class="tab-btn px-5 py-2.5 rounded-xl text-sm font-semibold flex items-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                <span>Materials</span>
            </button>
        </div>

        <!-- Content Sections -->
        <div id="content-bookings" class="glass rounded-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-800/50"><h3 class="text-lg font-bold text-white">All Bookings</h3></div>
            <div id="bookingsTable" class="p-4 space-y-3"><p class="text-slate-500 text-sm text-center py-8">Loading...</p></div>
        </div>

        <div id="content-inquiries" class="glass rounded-2xl overflow-hidden hidden">
            <div class="px-6 py-4 border-b border-slate-800/50"><h3 class="text-lg font-bold text-white">All Inquiries</h3></div>
            <div id="inquiriesTable" class="p-4 space-y-3"><p class="text-slate-500 text-sm text-center py-8">Loading...</p></div>
        </div>

        <div id="content-users" class="glass rounded-2xl overflow-hidden hidden">
            <div class="px-6 py-4 border-b border-slate-800/50"><h3 class="text-lg font-bold text-white">All Users</h3></div>
            <div id="usersTable" class="p-4 space-y-3"><p class="text-slate-500 text-sm text-center py-8">Loading...</p></div>
        </div>

        <div id="content-materials" class="glass rounded-2xl overflow-hidden hidden">
            <div class="px-6 py-4 border-b border-slate-800/50 flex justify-between items-center">
                <h3 class="text-lg font-bold text-white">Material Rates</h3>
                <button onclick="seedRates()" class="px-4 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 rounded-xl text-sm font-semibold transition-all duration-300 shadow-lg shadow-emerald-600/20 flex items-center space-x-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    <span>Seed Default Rates</span>
                </button>
            </div>
            <div id="materialsTable" class="p-4 space-y-3"><p class="text-slate-500 text-sm text-center py-8">Loading...</p></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('pakbuild_token');
        const user = JSON.parse(localStorage.getItem('pakbuild_user'));

        if (!token || !user || user.role !== 'admin') { window.location.href = 'login.html'; }

        document.getElementById('adminName').textContent = user?.name || 'Admin';
        document.getElementById('adminAvatar').textContent = (user?.name || 'A')[0].toUpperCase();
        const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

        function switchTab(tab) {
            ['bookings', 'inquiries', 'users', 'materials'].forEach(t => {
                document.getElementById(`content-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('active');
            });
            document.getElementById(`content-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        const statusColors = {
            pending: 'bg-amber-500/15 text-amber-400',
            confirmed: 'bg-emerald-500/15 text-emerald-400',
            completed: 'bg-blue-500/15 text-blue-400',
            cancelled: 'bg-red-500/15 text-red-400',
            new: 'bg-red-500/15 text-red-400',
            contacted: 'bg-blue-500/15 text-blue-400',
            resolved: 'bg-emerald-500/15 text-emerald-400',
            archived: 'bg-slate-500/15 text-slate-400'
        };

        async function loadDashboard() {
            try {
                const res = await fetch('/api/admin?action=dashboard', { headers });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('statUsers').textContent = data.stats.totalUsers;
                    document.getElementById('statBookings').textContent = data.stats.totalBookings;
                    document.getElementById('statPending').textContent = data.stats.pendingBookings;
                    document.getElementById('statInquiries').textContent = data.stats.totalInquiries;
                    document.getElementById('statNew').textContent = data.stats.newInquiries;
                    renderBookings(data.recentBookings);
                    renderInquiries(data.recentInquiries);
                } else {
                    document.getElementById('bookingsTable').innerHTML = '<p class="text-slate-500 text-sm text-center py-8">' + (data.message || 'Database not connected') + '</p>';
                    document.getElementById('inquiriesTable').innerHTML = '<p class="text-slate-500 text-sm text-center py-8">' + (data.message || 'Database not connected') + '</p>';
                }
                const usersRes = await fetch('/api/admin?action=users', { headers });
                const usersData = await usersRes.json();
                if (usersData.success) renderUsers(usersData.users);
                else document.getElementById('usersTable').innerHTML = '<p class="text-slate-500 text-sm text-center py-8">' + (usersData.message || 'Database not connected') + '</p>';
                loadMaterials();
            } catch (err) {
                console.error(err);
                ['bookingsTable', 'inquiriesTable', 'usersTable'].forEach(id => {
                    document.getElementById(id).innerHTML = '<p class="text-red-400 text-sm text-center py-8">Error loading data</p>';
                });
            }
        }

        function renderBookings(bookings) {
            const container = document.getElementById('bookingsTable');
            if (!bookings || bookings.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm text-center py-8">No bookings found.</p>';
                return;
            }
            container.innerHTML = bookings.map(b => `
                <div class="bg-slate-800/30 border border-slate-700/50 p-4 rounded-xl hover:border-slate-600/50 transition-all">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div class="flex-1">
                            <div class="flex items-center space-x-2">
                                <span class="text-white font-semibold">${b.name || 'N/A'}</span>
                                <span class="text-slate-600">&middot;</span>
                                <span class="text-slate-400 text-xs">${b.date} ${b.timeSlot}</span>
                            </div>
                            <p class="text-slate-400 text-xs mt-1">${b.serviceType} &middot; ${b.city}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-semibold ${statusColors[b.status] || ''}">${b.status}</span>
                            <select onchange="updateBookingStatus('${b._id}', this.value)" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                                <option value="pending" ${b.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="confirmed" ${b.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                                <option value="completed" ${b.status === 'completed' ? 'selected' : ''}>Completed</option>
                                <option value="cancelled" ${b.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                            </select>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderInquiries(inquiries) {
            const container = document.getElementById('inquiriesTable');
            if (!inquiries || inquiries.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm text-center py-8">No inquiries found.</p>';
                return;
            }
            container.innerHTML = inquiries.map(i => `
                <div class="bg-slate-800/30 border border-slate-700/50 p-4 rounded-xl hover:border-slate-600/50 transition-all">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div class="flex-1">
                            <div class="flex items-center space-x-2">
                                <span class="text-white font-semibold">${i.name}</span>
                                <span class="text-slate-600">&middot;</span>
                                <span class="text-slate-400 text-xs">${i.email}</span>
                            </div>
                            <p class="text-slate-400 text-xs mt-1">${i.serviceType} &middot; ${i.city} &middot; ${i.phone}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-semibold ${statusColors[i.status] || ''}">${i.status}</span>
                            <select onchange="updateInquiryStatus('${i._id}', this.value)" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                                <option value="new" ${i.status === 'new' ? 'selected' : ''}>New</option>
                                <option value="contacted" ${i.status === 'contacted' ? 'selected' : ''}>Contacted</option>
                                <option value="resolved" ${i.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                                <option value="archived" ${i.status === 'archived' ? 'selected' : ''}>Archived</option>
                            </select>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderUsers(users) {
            const container = document.getElementById('usersTable');
            if (!users || users.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm text-center py-8">No users found.</p>';
                return;
            }
            container.innerHTML = users.map(u => `
                <div class="bg-slate-800/30 border border-slate-700/50 p-4 rounded-xl hover:border-slate-600/50 transition-all">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl ${u.role === 'admin' ? 'bg-red-500/15 text-red-400' : 'bg-blue-500/15 text-blue-400'} flex items-center justify-center font-bold text-sm">${u.name[0].toUpperCase()}</div>
                            <div>
                                <span class="text-white font-semibold">${u.name}</span>
                                <p class="text-slate-400 text-xs">${u.email} &middot; ${u.role}</p>
                            </div>
                        </div>
                        <span class="text-slate-500 text-xs">${new Date(u.createdAt).toLocaleDateString()}</span>
                    </div>
                </div>
            `).join('');
        }

        async function loadMaterials() {
            try {
                const res = await fetch('/api/materials');
                const data = await res.json();
                const container = document.getElementById('materialsTable');
                if (data.success && data.rates && data.rates.length > 0) {
                    container.innerHTML = data.rates.map(r => `
                        <div class="bg-slate-800/30 border border-slate-700/50 p-4 rounded-xl hover:border-slate-600/50 transition-all">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center">
                                        <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                                    </div>
                                    <div>
                                        <span class="text-white font-semibold capitalize">${r.material}</span>
                                        <p class="text-slate-400 text-xs">${r.city} &middot; ${r.brand} &middot; ${r.unit}</p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="text-emerald-400 font-bold">PKR ${r.priceMin.toLocaleString()} - ${r.priceMax.toLocaleString()}</span>
                                    <p class="text-xs mt-1 ${r.trend === 'up' ? 'text-red-400' : r.trend === 'down' ? 'text-emerald-400' : 'text-slate-400'}">${r.trend === 'up' ? '&#9650;' : r.trend === 'down' ? '&#9660;' : '&mdash;'} ${Math.abs(r.trendPercent)}%</p>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="text-slate-500 text-sm text-center py-8">No rates found. Click "Seed Default Rates" to populate.</p>';
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function updateBookingStatus(id, status) {
            await fetch(`/api/bookings?action=status&id=${id}`, { method: 'PUT', headers, body: JSON.stringify({ status }) });
            loadDashboard();
        }

        async function updateInquiryStatus(id, status) {
            await fetch(`/api/inquiries?action=status&id=${id}`, { method: 'PUT', headers, body: JSON.stringify({ status }) });
            loadDashboard();
        }

        async function seedRates() {
            const btn = event.target.closest('button');
            btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg><span>Seeding...</span>';
            await fetch('/api/materials?action=seed', { method: 'POST', headers });
            loadMaterials();
        }

        function logout() {
            localStorage.removeItem('pakbuild_token');
            localStorage.removeItem('pakbuild_user');
            window.location.href = '../index.html';
        }

        loadDashboard();
    </script>
