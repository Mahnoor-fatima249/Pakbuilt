<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PakBuild Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <nav class="sticky top-0 z-50 glass border-b border-slate-800 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-xl">P</div>
            <span class="text-xl font-bold text-white">PakBuild<span class="text-emerald-500">Pro</span></span>
        </div>
        <div class="flex items-center space-x-4">
            <span id="userName" class="text-sm text-slate-300"></span>
            <a href="/" class="text-sm text-slate-400 hover:text-white transition">Home</a>
            <button onclick="logout()" class="text-sm text-red-400 hover:text-red-300 transition">Logout</button>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-white mb-2">My Dashboard</h1>
        <p class="text-slate-400 text-sm mb-8">Manage your saved projects and bookings</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass p-6 rounded-2xl">
                <span class="text-xs text-slate-400 uppercase tracking-wider">Saved Projects</span>
                <div id="projectCount" class="text-3xl font-bold text-emerald-400 mt-1">0</div>
            </div>
            <div class="glass p-6 rounded-2xl">
                <span class="text-xs text-slate-400 uppercase tracking-wider">My Bookings</span>
                <div id="bookingCount" class="text-3xl font-bold text-blue-400 mt-1">0</div>
            </div>
            <div class="glass p-6 rounded-2xl">
                <span class="text-xs text-slate-400 uppercase tracking-wider">My Inquiries</span>
                <div id="inquiryCount" class="text-3xl font-bold text-amber-400 mt-1">0</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="glass p-6 rounded-2xl">
                <h3 class="text-lg font-bold text-white mb-4">Saved Projects</h3>
                <div id="savedProjectsList" class="space-y-3">
                    <p class="text-slate-500 text-sm">No saved projects yet.</p>
                </div>
            </div>
            <div class="glass p-6 rounded-2xl">
                <h3 class="text-lg font-bold text-white mb-4">My Bookings</h3>
                <div id="bookingsList" class="space-y-3">
                    <p class="text-slate-500 text-sm">No bookings yet.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('pakbuild_token');
        const user = JSON.parse(localStorage.getItem('pakbuild_user'));

        if (!token) {
            window.location.href = '/pages/login.html';
        }

        document.getElementById('userName').textContent = user?.name || 'User';

        async function fetchDashboard() {
            try {
                const headers = { 'Authorization': `Bearer ${token}` };

                const projRes = await fetch('/api/auth?action=saved-projects', { headers });
                const projData = await projRes.json();
                if (projData.success) {
                    document.getElementById('projectCount').textContent = projData.savedProjects.length;
                    renderProjects(projData.savedProjects);
                }

                const bookRes = await fetch('/api/bookings?action=my', { headers });
                const bookData = await bookRes.json();
                if (bookData.success) {
                    document.getElementById('bookingCount').textContent = bookData.bookings.length;
                    renderBookings(bookData.bookings);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderProjects(projects) {
            const container = document.getElementById('savedProjectsList');
            if (projects.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm">No saved projects yet.</p>';
                return;
            }
            container.innerHTML = projects.map(p => `
                <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-xl">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-white font-semibold">${p.plotSize} Marla - ${p.city}</span>
                            <p class="text-slate-400 text-xs mt-1">${p.constructionType} | ${p.floors} Floor(s)</p>
                        </div>
                        <span class="text-emerald-400 font-bold text-sm">PKR ${(p.totalCost || 0).toLocaleString()}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderBookings(bookings) {
            const container = document.getElementById('bookingsList');
            if (bookings.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm">No bookings yet.</p>';
                return;
            }
            container.innerHTML = bookings.map(b => `
                <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-xl">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-white font-semibold">${b.date} - ${b.timeSlot}</span>
                            <p class="text-slate-400 text-xs mt-1">${b.serviceType} | ${b.city}</p>
                        </span>
                        <span class="px-2 py-1 rounded-lg text-xs font-semibold ${b.status === 'confirmed' ? 'bg-emerald-500/20 text-emerald-400' : b.status === 'pending' ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-500/20 text-slate-400'}">${b.status}</span>
                    </div>
                </div>
            `).join('');
        }

        function logout() {
            localStorage.removeItem('pakbuild_token');
            localStorage.removeItem('pakbuild_user');
            window.location.href = '/';
        }

        fetchDashboard();
    </script>
</body>
</html>
